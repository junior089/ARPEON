name: Prepare internal Windows candidate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prepare:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install and validate frontend
        working-directory: frontend
        shell: pwsh
        run: |
          foreach ($arguments in @(@('ci'), @('run','format:check'), @('run','lint'), @('run','typecheck'), @('test'), @('run','build'), @('audit','--audit-level=low'))) {
            & npm @arguments
            if ($LASTEXITCODE -ne 0) { throw "Frontend validation failed: $arguments" }
          }
      - name: Java validation and internal package
        shell: pwsh
        run: |
          node scripts/check-licenses.mjs
          if ($LASTEXITCODE -ne 0) { throw 'License inventory failed.' }
          ./gradlew.bat build --warning-mode=fail
          if ($LASTEXITCODE -ne 0) { throw 'Java validation failed.' }
          ./scripts/package-windows.ps1 -SkipFrontendBuild -OutputSubdirectory internal
          ./scripts/verify-package.ps1 -Package apps/desktop/build/native/internal/ARPEON
          python scripts/audit-dependencies.py --audiveris apps/desktop/build/native-resources/audiveris-5.11.0 --output apps/desktop/build/dependency-audit.json
          if ($LASTEXITCODE -ne 0) { throw 'Dependency audit failed.' }
      - name: Exercise isolated Windows Installer lifecycle
        shell: pwsh
        run: |
          $package = 'apps/desktop/build/native/internal/ARPEON'
          $fixtures = 'apps/desktop/build/msi-test-fixtures'
          # The second MSI changes installer metadata only; this is lifecycle acceptance,
          # not proof of a signed network update between two released application versions.
          ./scripts/build-windows-installer.ps1 -Package $package -Version 0.1.0 -OutputDirectory $fixtures -TestIdentity
          ./scripts/build-windows-installer.ps1 -Package $package -Version 0.1.1 -OutputDirectory $fixtures -TestIdentity
          ./scripts/test-msi-lifecycle.ps1 -TestIdentity -BaseInstaller "$fixtures/ARPEON-0.1.0.msi" -UpgradeInstaller "$fixtures/ARPEON-0.1.1.msi" -WorkingDirectory apps/desktop/build/msi-lifecycle-ci
      - name: Exercise Setup recovery after a failed upgrade
        shell: pwsh
        run: ./scripts/test-installer-recovery.ps1 -ApplicationImage apps/desktop/build/native/internal/ARPEON -OutputDirectory apps/desktop/build/installer-recovery-ci -TestRunId ci-recovery
      - name: Retain acceptance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-candidate-evidence
          if-no-files-found: warn
          path: |
            apps/desktop/build/dependency-audit.json
            apps/desktop/build/msi-lifecycle-ci/result.json
            apps/desktop/build/msi-lifecycle-ci/*.log
            apps/desktop/build/installer-recovery-ci/result.json
            apps/desktop/build/installer-recovery-ci/*.log
      # Native payloads remain private draft assets until redistribution is approved.
