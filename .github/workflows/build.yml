name: Build and test
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend checks
        working-directory: frontend
        shell: bash
        run: |
          npm ci
          npm run format:check
          npm run lint
          npm run typecheck
          npm test
          npm run build
          npm audit --audit-level=low
      - name: Dependency licenses
        run: node scripts/check-licenses.mjs
      - name: Java build, tests and format checks
        shell: bash
        run: bash ./gradlew build --warning-mode=fail
      - name: Package Windows executable
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          ./scripts/package-windows.ps1 -SkipFrontendBuild
          $archives = @(Get-ChildItem 'apps/desktop/build/native' -Filter 'ARPEON-*-windows-x64.zip')
          if ($archives.Count -ne 1 -or -not (Test-Path 'apps/desktop/build/native/ARPEON/ARPEON.exe')) {
            throw 'Windows release files are missing.'
          }
          $zip = $archives[0].FullName
          $actual = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          $expected = (Get-Content "$zip.sha256" -Raw).Split(' ')[0]
          if ($actual -ne $expected) { throw 'Windows ZIP checksum mismatch.' }
          ./scripts/verify-package.ps1 -Package apps/desktop/build/native/ARPEON
          python scripts/audit-dependencies.py --audiveris apps/desktop/build/native-resources/audiveris-5.11.0 --output apps/desktop/build/dependency-audit.json
          if ($LASTEXITCODE -ne 0) { throw 'Dependency audit failed.' }
          $java = Join-Path $env:JAVA_HOME 'bin/java.exe'
          & $java --enable-native-access=ALL-UNNAMED -classpath 'apps/desktop/build/classes/java/test;apps/desktop/build/native/ARPEON/app/*' org.arpeon.desktop.BundledOmrAcceptance (Resolve-Path apps/desktop/build/native/ARPEON/tools/audiveris-5.11.0) (Join-Path $env:RUNNER_TEMP 'arpeon-omr-profile') (Resolve-Path fixtures/omr) (Join-Path $env:RUNNER_TEMP 'arpeon-omr-results')
          if ($LASTEXITCODE -ne 0) { throw 'Real bundled OMR acceptance failed.' }
